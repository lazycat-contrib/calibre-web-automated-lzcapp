application:
  subdomain: calibre-web-automated
  multi_instance: false
  upstreams:
    - location: /
      backend: http://cwa:8083/
  injects:
    - id: cwa-login-autofill
      when:
        - /login
        - /login/
      do:
        - src: builtin://simple-inject-password
          params:
            user: "{{ .U.login_user }}"
            password: "{{ .U.login_password }}"
            userSelector: "input#username"
            passwordSelector: input#password[type="password"]
            formSelector: "form.cwa-login-form"
            autoSubmit: false
services:
  cwa:
    # upstream: docker.io/crocodilestick/calibre-web-automated:v4.0.8
    image: docker.1ms.run/crocodilestick/calibre-web-automated:v4.0.8
    environment:
      - TZ=Asia/Shanghai
      - PUID=1000
      - PGID=1000
    binds:
      - /lzcapp/var/config:/config
      - /lzcapp/var/ingest:/cwa-book-ingest
      - /lzcapp/var/library:/calibre-library
usage: |
  Calibre-Web-Automated 电子书库管理器。/config 保存应用配置，/calibre-library 是 Calibre 书库（首次自动建库），/cwa-book-ingest 是自动入库目录（处理后清空）。
  部署参数里的用户名和密码是初始登录凭据，默认密码已被替换为随机值；首次登录后请尽快在应用设置中修改。登录页会自动填充但不自动提交。
  首次使用需在应用内初始化书库位置为 /calibre-library；电子书复制到入库目录后会按设置自动转换并移入库。
  格式转换依赖容器内置 Calibre 组件，实际转换结果取决于源文件质量；DRM 保护的电子书无法转换。
  入口保留懒猫登录保护；无公开路径、不挂 Docker socket 或宿主机目录。
  无文件选择器拦截、无 smoke；未验证实机启动、书库初始化、格式转换或自动入库。
